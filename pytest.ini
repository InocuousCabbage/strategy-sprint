[pytest]
# strategy-sprint has no packaging (setup.py / pyproject.toml build) — it's
# a fixture repo containing skills + a vendored generator. pytest normally
# uses the invocation directory for sys.path when run as `python -m pytest`,
# but bare `pytest` doesn't. `rootdir_hint` isn't a real setting; the correct
# fix is pythonpath to explicitly add the repo root so `from pipelines.gtm_generator...`
# resolves in both invocation shapes + in CI.
pythonpath = .
testpaths = tests
